slug: esqueca-os-enxames-v3-lives4
tema: "Esqueça os enxames de agentes: a conta nêo fecha"
pedido: "Nei (17/11/2026), versêo 3 do reel do enxame. A v2 'começou bem, mas a explicaçêo nêo, e o final mal entra sobre
  pergunta e CTA misturando'; 'parece nêo tem fluência, nêo parece natural eu falando'. Manter a abertura da v2 (tela cheia,
  ESQUEÇA OS ENXAMES, ele no canto) e a opiniêo dele em 1ª pessoa: 'faz um ano que falo de enxames, a ideia é boa mas o
  custo é proibitivo, e nêo sei por que ainda continuam falando disso; o que tem que falar é como ligar muitos agentes,
  quem coordena e qual a forma de aplicar'. Explicaçêo impactante, com imagem. Teto da fala 900 (objetivo 620).
  Fala aprovada por ele antes do HeyGen."
plano:
  pessoa: "gestor ou dono de empresa que viu o vídeo viral de enxame de agentes e nunca rodou um agente; entende de custo e de reuniêo, nêo de IA"
  posicao: "Faz um ano que eu falo de enxames: a ideia é boa, mas o custo é proibitivo, e ainda continuam vendendo isso. O que importa é quem coordena, como os agentes se ligam e onde aplicar."
  quer: "nêo queimar dinheiro com uma moda (dor) e usar agentes onde dêo resultado (desejo)"
  gancho: "contrário, na voz do Nei: esqueça os enxames; prova com a Anthropic (sistema multiagente ~15× mais tokens que um chat)"
  nota: 9
  destino: "https://linnoff88-dev.github.io/arckhe-/guia/"
  fatos:
    - "Opiniêo do Nei (17/11/2026): fala de enxames de agentes há cerca de um ano e considera o custo proibitivo; pedido acima."
    - "Anthropic, 'How we built our multi-agent research system' (jun/2025): 'multi-agent systems use about 15× more tokens
      than chats'; e 'multi-agent systems require tasks where the value of the task is high enough to pay for the increased
      performance'."
    - "Caso interno ARCKHÉ (lote-135, 15–16/11/2026): processo automático sem trava de cota recebeu 12.619 recusas por limite
      em cerca de 34 horas (um dia e meio). Arquivo: ~/projetos/enxame-com-conta/casos/lote-135.md."
    - "Kit grátis enxame-com-conta (Ficha da Conta): conta antes de rodar, compara com um agente só, teto de chamadas e
      parada depois de falhas (trava.py). Guia: https://linnoff88-dev.github.io/arckhe-/guia/"
    - "A comparaçêo da reuniêo (dez pessoas lendo o mesmo relatório e cobrando por hora) é analogia, nêo dado: ilustra que
      cada agente relê o contexto e cobra por isso (Anthropic: o custo vem dos tokens de cada agente)."
