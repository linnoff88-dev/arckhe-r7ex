marca: "ARCKHÉ · AGENTES"
selo: "CONTA QUE NêO FECHA"
fonte: "<b>Anthropic</b> · How we built our multi-agent research system, jun/2025 · caso interno ARCKHÉ, nov/2026 · imagens: ilustraçêo"

abertura:
  cor: amarelo
  layout: cheia
  cena: "sala de reuniêo de empresa à noite, mesa comprida cheia de robôs humanoides dourados de visor preto falando todos
    ao mesmo tempo, gesticulando; na parede do fundo um taxímetro vermelho gigante com o visor em R$ subindo; na porta, de
    costas, um gestor de camisa social com a mêo na cabeça olhando a conta; luz vermelha de alerta, preto e amarelo"

trocas:
  "quinze vezes": "15×"
  "doze mil": "12 mil"
  "um ano": "1 ano"
  "dez pessoas": "10 pessoas"

partes:
  - etapa: gancho
    fala: "Esqueça os enxames de agentes. Faz um ano que eu falo disso: a ideia é boa, mas o custo é proibitivo, e ainda continuam vendendo isso."
    prende: "manda parar o que o viral vende, na voz de quem fala disso há um ano; 'ainda vendem isso' deixa a pergunta: por quê?"
    painel:
      titulo: "O CUSTO É PROIBITIVO"
      de: "custo"
      cor: "#ff2a1f"
  - etapa: medo
    fala: "Cada agente relê tudo de novo, conversa com os outros e refaz o que deu errado, e você paga cada palavra. A Anthropic mediu: gasta quinze vezes mais que um chat. E nêo é erro seu, é a conta."
    prende: "o gestor vê onde o dinheiro some e o número com fonte confirma; tira a culpa de quem acreditou"
    logos: [{id: anthropic, nome: Anthropic}]
    lista:
      k: "ONDE O DINHEIRO SOME"
      borda: red
      itens: [["relê", "📚 cada agente relê tudo"], ["conversa", "💬 agente falando com agente"], ["refaz", "🔁 refaz o que errou"]]
    painel:
      de: "15×"
      k: "ANTHROPIC · JUN/2025"
      borda: red
      contador: {ate: 15, em: "15×", cor: "#ff2a1f", unid: "× MAIS QUE UM CHAT"}
      l: "sistema multiagente × conversa"
  - etapa: desejo
    fala: "É como chamar dez pessoas para uma reuniêo, todas lendo o mesmo relatório e cobrando por hora. Se ninguém coordena, a conta só cresce."
    prende: "a comparaçêo que todo gestor já viveu: a reuniêo cara que nêo decide nada; agora ele VÊ o problema"
    imagem: "sala de reuniêo de empresa, mesa comprida com dez robôs humanoides dourados sentados, todos lendo o mesmo relatório
      grosso de papel; na frente de cada um um pequeno taxímetro vermelho marcando R$; a cadeira da cabeceira da mesa VAZIA
      com um holofote em cima; luz fria, preto e amarelo, vermelho só nos taxímetros, fotorrealista"
    painel:
      titulo: "NINGUÉM COORDENA"
      de: "coordena"
      cor: "#ff2a1f"
  - etapa: facilidade
    fala: "A pergunta certa nêo é quantos agentes. É quem coordena, como eles se ligam e onde vale aplicar: um coordenador, poucos especialistas, um teto de gasto e a hora de parar."
    prende: "troca a moda pela pergunta de gestor e já dá a regra que ele aplica amanhê, sem saber programar"
    diagrama:
      forma: fluxo
      titulo: "O JEITO QUE FECHA A CONTA"
      nos:
        - {de: "coordenador", ic: "🧭", txt: "Um coordenador"}
        - {de: "especialistas", ic: "🤖", txt: "Poucos especialistas"}
        - {de: "teto", ic: "💰", txt: "Teto de gasto"}
        - {de: "parar", ic: "🛑", txt: "Hora de parar", cor: vd}
    painel:
      titulo: "QUEM COORDENA?"
      de: "coordena"
      cor: "#FACC15"
  - etapa: descoberta
    fala: "Um processo nosso rodou sem trava e bateu no limite doze mil vezes. Foi daí que eu fiz a Ficha da Conta."
    prende: "caso real da casa, sem vergonha do erro, e o nome do método que nasceu dele"
    imagem: "monitor de computador num escritório escuro com a tela inteira tomada por linhas vermelhas repetidas de erro
      'LIMITE', rolando sem parar; um contador vermelho grande no canto da tela; luz vermelha refletindo na mesa vazia,
      fotorrealista, preto e vermelho"
    painel:
      de: "12"
      k: "CASO ARCKHÉ · NOV/2026"
      borda: red
      contador: {ate: 12619, em: "12", cor: "#ff2a1f", unid: "RECUSAS EM 34 H"}
      l: "processo sem trava"
  - etapa: beneficio
    fala: "Menos agente, mais resultado. Só cresce se o resultado paga."
    prende: "máxima curta que o gestor repete na reuniêo"
    imagem: "um taxímetro antigo com o visor apagado e uma mêo girando a chave para desligar, luz amarela recortada, fundo preto liso"
    painel:
      titulo: "SÓ CRESCE SE O RESULTADO PAGA"
      de: "paga"
      cor: "#FACC15"
  - etapa: comentario
    fala: "Toda semana tem kit novo, grátis, no ARCKHÉ ponto club. E na sua empresa, quem coordena os agentes?"
    prende: "pergunta de gestor que a pessoa responde com a própria empresa"
    print:
      url: "https://linnoff88-dev.github.io/arckhe-/guia/"
      selo: "FICHA DA CONTA · KIT GRÁTIS"

