  manchete: "ESQUEÇA OS ENXAMES DE AGENTES"
  destaque: "ESQUEÇA"
  objeto: "um taxímetro vermelho gigante na parede marcando R$ e subindo sem parar, o visor borrado de têo rápido"
  entrega: "por que o enxame nêo fecha a conta e o jeito certo: quem coordena, como ligar os agentes e onde vale aplicar"
  prova: {parte: 2, de: "15×"}
  absolvicao: "nêo é erro seu"
  fontes:
